<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tanti auguri Ellie 🎂</title>

    <meta property="og:type" content="website">
    <meta property="og:title" content="Tanti auguri Ellie 🎂">
    <meta property="og:description" content="Fai sgobbare il criceto per ottenere la tua ricompensa!">
    <meta property="og:url" content="https://francescaaloisi.github.io/hamster_slider/">
    <meta property="og:image" content="https://francescaaloisi.github.io/hamster_slider/og-image.png">
    <meta property="og:image:type" content="image/png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:locale" content="it_IT">
    <meta name="twitter:card" content="summary_large_image">

    <!-- Font corsivo (Lobster Two) -->
   <link rel="preconnect" href="https://fonts.googleapis.com">
   <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
   <link href="https://fonts.googleapis.com/css2?family=Lobster+Two:wght@400;700&display=swap" rel="stylesheet">
   <!-- link per la versione italic-->
   <!--<link href="https://fonts.googleapis.com/css2?family=Lobster+Two:ital,wght@1,400;1,700&display=swap" rel="stylesheet"> -->

    <link rel="stylesheet" href="hamster-slider.css">
  </head>
  <body>

    <!-- Scritta fissa in alto: titolo grande + frase più piccola a capo -->
    <header class="title">
      <h1>Tanti auguri Ellie!</h1>
      <p class="subtitle">Fai sgobbare il criceto spostando il cursore per ottenere la tua ricompensa</p>
    </header>

    <div class="wrapper">
      <div class="wheel-frame pix">
        <div class="wheel">
          <div class="wheel-support pix"></div>
          <div class="hamster puff pix">
            <div class="ear pix"></div>
            <div class="head puff pix"></div>
            <div class="bum puff pix"></div>
          </div>
        </div>
      </div>
      <input type="range" name="speed" min="0" max="11" value="3" aria-label="Velocità del criceto">

      <!-- Scritta che compare quando lo slider è al massimo -->
      <p class="reward" aria-live="polite">Complimenti, ti sei guadagnata un desiderio da esprimere ⋆˙⟡</p>
    </div>
    <script src="hamster-slider.js"></script>
  </body>
</html>
